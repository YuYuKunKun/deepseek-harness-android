# dsh-agent-notify bundle patch: registers the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); activate with
# `dsh plugin --profile web add dsh-agent-notify` (npm) or
# `dsh plugin --profile web add github:chidaic/dsh-agent-notify`.
#
# The row is a bare plugin by package name: the host half (exports ".") is an
# empty apply, and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at /plugins/dsh-agent-notify/client.js)
# load in the web GUI.
- insert:
    - id: agent-notify
      name: 'dsh-agent-notify'
